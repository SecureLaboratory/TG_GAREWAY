# Secrets as files instead of .env (use together with docker-compose.prod.yml):
#   COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml:docker-compose.secrets.yml
# Put one file per secret into SECRETS_DIR (default /run/tgviewer-secrets; keep it on tmpfs, i.e.
# in memory) before starting, from your secret store: OpenBao agent, sops, a cloud secret manager, …
# Files: master_key tg_api_id tg_api_hash abusech_auth_key vt_api_key database_password
# (an unused optional secret: an empty file). Each container gets only the secrets it needs.
# See docs/PRODUCTION.md.

secrets:
  master_key:        { file: "${SECRETS_DIR:-/run/tgviewer-secrets}/master_key" }
  tg_api_id:         { file: "${SECRETS_DIR:-/run/tgviewer-secrets}/tg_api_id" }
  tg_api_hash:       { file: "${SECRETS_DIR:-/run/tgviewer-secrets}/tg_api_hash" }
  abusech_auth_key:  { file: "${SECRETS_DIR:-/run/tgviewer-secrets}/abusech_auth_key" }
  vt_api_key:        { file: "${SECRETS_DIR:-/run/tgviewer-secrets}/vt_api_key" }
  database_password: { file: "${SECRETS_DIR:-/run/tgviewer-secrets}/database_password" }

services:
  api:
    secrets: [master_key, tg_api_id, tg_api_hash, abusech_auth_key, vt_api_key, database_password]
    environment:
      REQUIRE_MASTER_KEY: "true"     # refuse to start (never invent a new key) without the master_key file
      MASTER_KEY_FILE: /run/secrets/master_key
      TG_API_ID_FILE: /run/secrets/tg_api_id
      TG_API_HASH_FILE: /run/secrets/tg_api_hash
      ABUSECH_AUTH_KEY_FILE: /run/secrets/abusech_auth_key
      VT_API_KEY_FILE: /run/secrets/vt_api_key
      DATABASE_PASSWORD_FILE: /run/secrets/database_password
      # Make sure secrets left in .env are not used:
      MASTER_KEY: ""
      TG_API_ID: ""
      TG_API_HASH: ""
      ABUSECH_AUTH_KEY: ""
      VT_API_KEY: ""

  postgres:
    secrets: [database_password]
    environment:
      POSTGRES_PASSWORD: !reset null
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
