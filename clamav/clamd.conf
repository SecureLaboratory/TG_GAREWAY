# Official image defaults, plus: log every scan (clean ones too) so ClamAV's own log proves
# what it scanned. clamd never sees file names from the gateway, only the stream.
LogFile /var/log/clamav/clamd.log
LogTime yes
LogClean yes
# One signature database in memory during the daily reload (halves peak RAM; fine on 4 GB).
ConcurrentDatabaseReload no
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav
